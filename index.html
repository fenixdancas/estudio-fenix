<script>
const LOGIN_ART = "./logo-fenix.png";
const LOGO = "./logo-fenix-marca.png";
const FE = "./fenix-elemento.png";
const META_CONFIG = Object.freeze({
  appId: "1519791146860663",
  configId: "2281774802614136"
});

let metaSdkReady = false;

window.fbAsyncInit = function(){
  FB.init({appId:META_CONFIG.appId,cookie:true,xfbml:false,version:"v25.0"});
  metaSdkReady = true;
};

function metaStatus(text,ok=false){
  const el=document.getElementById("metaCoexistenciaStatus");
  if(el){el.textContent=text;el.className=ok?"badge ok":"small muted";}
}

function launchMetaCoexistencia(){
  metaStatus("Abrindo a conexão com a Meta...");
  const launch=()=>{
    FB.login(async function(response){
      const code=response?.authResponse?.code;
      if(!code){
        metaStatus("A conexão não foi concluída.");
        return;
      }
      try{
        const result=await callFenixAppsScript("meta_coexistence_complete",{code});
        if(!result?.ok) throw new Error(result?.error||"Não foi possível concluir a conexão.");
        metaStatus("WhatsApp conectado à Coexistência.",true);
        alert("WhatsApp conectado com sucesso.\n\nNúmero: "+(result.display_phone_number||"não informado")+"\nWABA: "+(result.waba_id||"não informado"));
      }catch(err){
        metaStatus("Não foi possível concluir a conexão.");
        alert(err.message||"Não foi possível concluir a conexão.");
      }
    },{
      config_id:META_CONFIG.configId,
      response_type:"code",
      override_default_response_type:true,
      extras:{
        setup:{},
        featureType:"whatsapp_business_app_onboarding",
        version:"v4"
      }
    });
  };
  if(metaSdkReady) launch();
  else {

const CONTRACT = "Contrato de Prestação de Serviço\nCLÁUSULA 1ª – FINALIDADE\nO contrato é estabelecido sob a lei nº 13.278/2016 de Diretrizes e Bases da Educação Nacional, e tem por finalidade a prestação de serviços educacionais em DANÇA.\nCLÁUSULA 2ª – PAGAMENTO E ENCARGOS\nO valor da mensalidade e taxa de matrícula, assim como pacotes promocionais, são informados na secretaria ou através do atendimento online. A mensalidade deve ser paga na data escolhida via PIX, cartão de débito ou dinheiro. Atrasos geram multa de 5% e juros de 1% ao dia. Em caso de atraso, o aluno ou responsável deve entrar em contato com a secretaria para solicitar o valor corrigido.\nServiços adicionais, como: cursos, workshops, figurinos, inscrições, serão cobrados separadamente.\n2.1. Natureza dos Pagamentos Iniciais. O valor referente à Taxa de Matrícula e à Primeira Mensalidade, pagos no ato da matrícula, referem-se, respectivamente, aos custos administrativos e à remuneração do primeiro mês de aulas. Nenhum destes valores constitui caução, taxa de reserva ou crédito para cobrir mensalidades futuras. Em caso de rescisão contratual, o pagamento integral da mensalidade é devido, a menos que haja comunicação formal de desistência conforme a CLÁUSULA 10ª.\nCLÁUSULA 3ª – INADIMPLÊNCIA, COBRANÇA E NEGATIVAÇÃO\n3.1. O atraso no pagamento da mensalidade, a partir de 30 (trinta) dias, a contar da data de vencimento, caracterizará o aluno ou responsável como inadimplente.\n3.2. Fica expressamente reservado ao Estúdio o direito de, após prévia notificação ao aluno ou responsável, através de e-mail ou WhatsApp, realizar a cobrança extrajudicial e incluir o CPF nos cadastros de proteção ao crédito (SERASA, SPC, etc.).\n3.3. Todos os custos decorrentes da cobrança, incluindo custas judiciais e honorários advocatícios e de cobrança, serão de responsabilidade do aluno ou responsável.\n3.4. O Estúdio se compromete a promover a imediata baixa do registro após a comprovação do pagamento integral dos débit function remoteId(table, localId){
  return remoteIds[table+":"+String(localId)] || null;
}
function rememberRemoteId(table, localId, remoteIdValue){
  if(localId!=null && remoteIdValue) remoteIds[table+":"+String(localId)]=remoteIdValue;
}
function localId(table, remoteIdValue){
  const key=table+":"+String(remoteIdValue);
  for(const k in remoteIds){ if(k===key) return Number(remoteIds[k+":local"]||0)||remoteIds[k+":local"]; }
  const n=Date.now()+Math.floor(Math.random()*1000);
  remoteIds[key]=remoteIdValue;
  remoteIds[key+":local"]=n;
  return n;
}
function localForRemote(table, uuid){
  const k=table+":"+String(uuid);
  if(remoteIds[k+":local"]!=null) return remoteIds[k+":local"];
  const n=Date.now()+Math.floor(Math.random()*1000);
  remoteIds[k]=uuid;
  remoteIds[k+":local"]=n;
  return n;
}
function remoteForLocal(table,id){
  return remoteIds[table+":"+String(id)] || null;
}

function removeDuplicateTeachers(){
  const normalizeName=value=>String(value||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const score=teacher=>[teacher.foto,teacher.fone,teacher.email,teacher.cpf,teacher.apelido,teacher.obs].filter(Boolean).length+
    db.classes.filter(c=>teacherIdMatches(c.profId,teacher.id)).length*2;
  const keepByName=new Map(), replacedIds=new Map();
  db.teachers.forEach(teacher=>{
    const key=normalizeName(teacher.apelido||teacher.nome);
    if(!key){keepByName.set("id:"+teacher.id,teacher);return;}
    const current=keepByName.get(key);
    if(!current){keepByName.set(key,teacher);return;}
    if(score(teacher)>score(current)){
      replacedIds.set(String(current.id),teacher.id);
      keepByName.set(key,teacher);
    }else{
      replacedIds.set(String(teacher.id),current.id);
    }
  });
  db.classes.forEach(c=>{const replacement=replacedIds.get(String(c.profId));if(replacement!=null)c.profId=replacement;});
  db.teachers=[...keepByName.values()];
  saveLocalOnly();
}

function uniqueTeachers(){
  const normalizeName=value=>String(value||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const score=teacher=>[teacher.foto,teacher.fone,teacher.email,teacher.cpf,teacher.apelido,teacher.obs].filter(Boolean).length+
    db.classes.filter(c=>teacherIdMatches(c.profId,teacher.id)).length*2;
  const unique=new Map();
  db.teachers.forEach(teacher=>{
    const key=normalizeName(teacher.apelido||teacher.nome)||"id:"+teacher.id;
    const current=unique.get(key);
    if(!current||score(teacher)>score(current))unique.set(key,teacher);
  });
  return [...unique.values()];
}

  const remembered=JSON.parse(localStorage.getItem("fenix_remember_me")||"null");
  user.value=(remembered?.user && users.some(u=>u.id===remembered.user))?remembered.user:(users[0]?.id||"nahid");
  pass.value="";
  const updateUser=()=>{const selected=users.find(u=>u.id===user.value);if(userValue)userValue.textContent=selected?.nome||"";};
  if(menu){menu.innerHTML=users.map(u=>`<div class="login-user-option" role="option" data-id="${esc(u.id)}">${esc(u.nome)}</div>`).join("");menu.querySelectorAll(".login-user-option").forEach(o=>o.onclick=()=>{user.value=o.dataset.id;updateUser();menu.classList.remove("open")});}

  enter.onclick=async e=>{
    e.preventDefault();
    const u=users.find(x=>x.id===user.value), password=pass.value;
    if(!u||!u.email){alert("Este acesso ainda não possui e-mail de autenticação configurado.");return;}
    if(u.tipo==="teacher"&&u.ativo===false){alert("Este acesso está desativado.");return;}
    let authClient=supabaseClient;
    let data,error,profile,profileError;
    const tryAuth=async(client,profileTable)=>{
      const result=await client.auth.signInWithPassword({email:u.email,password});
      if(result.error) return {error:result.error};
      const pr=await client.from(profileTable).select(profileTable==="perfis"?"id,nome,papel,status,professora_id":"id,nome,perfil,ativo").eq("id",result.data.user.id).single();
      return {data:result.data,error:pr.error,profile:pr.data,profileTable};
    };
    let result=await tryAuth(authClient,"perfis");
    if(result.error){
      await authClient.auth.signOut().catch(()=>{});
      authClient=window.supabase.createClient(LEGACY_SUPABASE_CONFIG.url,LEGACY_SUPABASE_CONFIG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
      result=await tryAuth(authClient,"profiles");
      if(!result.error) authProject="legacy";
    }
    if(result.error){alert("Usuário ou senha incorretos.");return;}
    data=result.data; profile=result.profile; profileError=result.error;
    if(authProject==="legacy"){
      if(!profile || profile.ativo!==true){await authClient.auth.signOut();alert("Este acesso está desativado ou não foi configurado no Supabase.");return;}
      if((u.tipo==="admin" && profile.perfil!=="admin") || (u.tipo==="teacher" && profile.perfil!=="professora")){await authClient.auth.signOut();alert("O usuário selecionado não corresponde ao perfil autenticado.");return;}
      session={id:profile.id,nome:profile.nome||u.nome,tipo:profile.perfil==="admin"?"admin":"teacher",teacherId:u.teacherId,email:data.user.email,authUserId:data.user.id};
    }else{
      if(!profile || profile.status!=="ativo"){await authClient.auth.signOut();alert("Este acesso está desativado ou não foi configurado no Supabase.");return;}
      session={id:profile.id,nome:profile.nome,tipo:profile.papel==="admin"?"admin":"teacher",teacherId:profile.professora_id,email:data.user.email,authUserId:data.user.id};
    }
    supabaseClient=authClient;
    supabaseReady=true;
    try{
      await loadSupabaseDb();
    }catch(err){
      console.error("Não foi possível carregar a base remota; abrindo com os dados locais.",err);
    }
    removeDuplicateTeachers();
    if(remember.checked)localStorage.setItem("fenix_remember_me",JSON.stringify({user:u.id}));else localStorage.removeItem("fenix_remember_me");
    sessionStorage.setItem("fenix_session",data.user.id);
    start();
  };
  pass.onkeydown=e=>{if(e.key==="Enter")enter.click()};
  document.getElementById("loginEye").onclick=()=>{pass.type=pass.type==="password"?"text":"password"};
  document.getElementById("loginForgot").onclick=async()=>{const u=users.find(x=>x.id===user.value);if(!u?.email){alert("Configure o e-mail deste acesso primeiro.");return}const {error}=await supabaseClient.auth.resetPasswordForEmail(u.email,{redirectTo:location.origin+location.pathname});alert(error?"Não foi possível enviar o e-mail de recuperação.":"Enviamos as instruções para o e-mail cadastrado.")};
}

async function startContractAcceptance(){
  const token=new URLSearchParams(location.search).get("contrato");
  if(!token) return false;
  document.body.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f7f3ee;padding:24px"><div style="width:min(720px,100%);background:#fff;border-radius:18px;padding:30px;box-shadow:0 10px 35px rgba(0,0,0,.12);font-family:inherit"><h1 style="margin-top:0">Contrato do Estúdio de Danças Fênix</h1><p>Leia o contrato enviado pelo Estúdio e, estando de acordo, informe os dados para registrar o aceite.</p><div id="contractAcceptanceBox"><p>Carregando contrato...</p></div></div></div>`;
  if(!initSupabase()){
    document.getElementById("contractAcceptanceBox").innerHTML="<p>O sistema de contratos não está configurado.</p>";
    return true;
  }
  const {data,error}=await supabaseClient.from("contratos").select("id,conteudo,status").eq("token_aceite",token).in("status",["pendente","enviado"]).maybeSingle();
  if(error||!data){
    document.getElementById("contractAcceptanceBox").innerHTML="<p>Este link de contrato é inválido, expirou ou já foi utilizado.</p>";
    return true;
  }
  const box=document.getElementById("contractAcceptanceBox");
  box.innerHTML=`<div style="max-height:420px;overflow:auto;border:1px solid #ddd;border-radius:10px;padding:18px;white-space:pre-wrap;margin:18px 0">${esc(data.conteudo||"")}</div><label style="display:block;margin:12px 0 6px">Nome completo</label><input id="acceptName" style="width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box"><label style="display:block;margin:12px 0 6px">CPF/RG ou documento</label><input id="acceptDocument" style="width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box"><label style="display:flex;gap:8px;align-items:center;margin:16px 0"><input type="checkbox" id="acceptCheck"> Declaro que li, compreendi e aceito o contrato.</label><button id="acceptButton" style="padding:12px 20px;border:0;border-radius:8px;cursor:pointer">Aceitar contrato</button><div id="acceptResult" style="margin-top:14px"></div>`;
  document.getElementById("acceptButton").onclick=async()=>{
    const nome=document.getElementById("acceptName").value.trim();
    const documento=document.getElementById("acceptDocument").value.trim();
    const confirmado=document.getElementById("acceptCheck").checked;
    const result=document.getElementById("acceptResult");
    if(!nome||!documento||!confirmado){result.textContent="Preencha os dados e confirme o aceite.";return;}
    const {data:accepted,error:acceptError}=await supabaseClient.rpc("aceitar_contrato",{p_token:token,p_nome:nome,p_documento:documento});
    if(acceptError){result.textContent="Não foi possível registrar o aceite. O contrato pode já ter sido aceito.";return;}
    result.textContent="Contrato aceito com sucesso. Data e horário foram registrados.";
    document.getElementById("acceptButton").disabled=true;
  };
  return true;
}

function teacherIdMatches(a,b){
 const na=String(a??"").trim(), nb=String(b??"").trim();
 if(!na||!nb)return false;
 const clean=x=>x.replace(/^prof:/i,"").trim();
 const ca=clean(na), cb=clean(nb);
 if(ca===cb)return true;
 if(Number.isFinite(Number(ca))&&Number.isFinite(Number(cb)))return Number(ca)===Number(cb);
 return false;
}
function teacherOwnsClass(c){
 if(session?.tipo!=="teacher"||!c)return false;
 const sid=String(session.teacherId||session.id||"").replace(/^prof:/i,"").trim();
 const teacher=db.teachers.find(t=>teacherIdMatches(t.id,sid)||String(t.login||"").trim().toLowerCase()===String(session.nome||"").trim().toLowerCase());
 const teacherIds=teacher?[teacher.id,teacher.login,teacher.apelido,teacher.email]:[];
 teacherIds.push(session.teacherId,session.id);
 const classIds=[c.profId,c.professorId,c.professoraId,c.teacherId,c.idProfessor,c.idProfessora];
 if(classIds.some(cid=>teacherIds.some(tid=>teacherIdMatches(cid,tid))))return true;
 const classNames=[c.professora,c.professor,c.professoraNome,c.professorNome,c.teacherName,c.nomeProfessora,c.nomeProfessor,c.professoraResponsavel,c.professorResponsavel,c.teacher].map(v=>String(v??"").trim().toLowerCase()).filter(Boolean);
 const teacherNames=teacher?[teacher.nome,teacher.apelido,teacher.login,session.nome].map(v=>String(v??"").trim().toLowerCase()).filter(Boolean):[String(session.nome||"").trim().toLowerCase()];
 return classNames.some(n=>teacherNames.includes(n));
}
function teacherOwnsStudent(s){
 if(session?.tipo!=="teacher")return true;
 const ids=Array.isArray(s?.turmaIds)?s.turmaIds:(s?.turmaId!=null?[s.turmaId]:[]);
 return ids.some(id=>db.classes.some(c=>teacherIdMatches(c.id,id) && teacherOwnsClass(c)));
}
function visibleClasses(){

}
function visibleStudents(){

function bind(){
 if(view==="alunos"){
  const input=document.getElementById("studentSearch");
  const draw=()=>{let q=(input.value||"").toLowerCase();let a=db.students.filter(s=>(s.nome+" "+(s.fone||"")).toLowerCase().includes(q));
  document.getElementById("studentTable").innerHTML=session?.tipo==="teacher"?`<table><tr><th>Foto</th><th>Nome</th><th>Contato</th><th>Responsável</th><th>Turma</th><th>Status</th><th></th></tr>${a.filter(teacherOwnsStudent).map(s=>`<tr><td>${s.foto?`<img class="avatar-img" src="${s.foto}" alt="">`:`<div class="avatar">${esc((s.nome||"A").slice(0,1).toUpperCase())}</div>`}</td><td><strong>${esc(s.nome)}</strong></td><td>${esc(s.fone||"—")}</td><td>${esc(s.respNome||"—")}</td><td>${esc((Array.isArray(s.turmaIds)?s.turmaIds:(s.turmaId?[s.turmaId]:[])).map(id=>db.classes.find(c=>c.id==id)?.nome).filter(Boolean).join(", ")||"—")}</td><td><span class="badge ok">Ativo</span></td><td><button class="btn" onclick="abrirAluno(${s.id})">Abrir ficha</button></td></tr>`).join("")||tableEmpty(7)}</table>`:`<table><tr><th>Foto</th><th>Nome</th><th>Contato</th><th>Responsável</th><th>Turma</th><th>Mensalidade</th><th>Status</th><th></th></tr>${a.map(s=>`<tr><td>${s.foto?`<img class="avatar-img" src="${s.foto}" alt="">`:`<div class="avatar">${esc((s.nome||"A").slice(0,1).toUpperCase())}</div>`}</td><td><strong>${esc(s.nome)}</strong></td><td>${esc(s.fone||"—")}</td><td>${esc(s.respNome||"—")}</td><td>${esc((Array.isArray(s.turmaIds)?s.turmaIds:(s.turmaId?[s.turmaId]:[])).map(id=>db.classes.find(c=>c.id==id)?.nome).filter(Boolean).join(", ")||"—")}</td><td>${money(s.mensalidade)}</td><td><span class="badge ok">Ativo</span></td><td><button class="btn" onclick="abrirAluno(${s.id})">Abrir ficha</button></td></tr>`).join("")||tableEmpty(8)}</table>`};input.oninput=draw;draw();
 }
 if(view==="busca"){
  const input=document.getElementById("globalSearch"), out=document.getElementById("searchResults");
  input.oninput=()=>{let q=input.value.toLowerCase().trim();if(!q){out.innerHTML="";return}
   let a=[...db.students.map(x=>({tipo:"Aluno",nome:x.nome,extra:x.fone||""})),...db.teachers.map(x=>({tipo:"Professor",nome:x.nome,extra:x.fone||""})),...db.classes.map(x=>({tipo:"Turma",nome:x.nome,extra:x.dia+" · "+x.hora}))].filter(x=>(x.nome+" "+x.extra).toLowerCase().includes(q));
   out.innerHTML=`<div class="panel">${a.map(x=>`<p><span class="badge neutral">${x.tipo}</span> <strong>${esc(x.nome)}</strong> <span class="muted">${esc(x.extra)}</span></p>`).join("")||'<p class="muted">Nenhum resultado.</p>'}</div>`;
  }
 }
}

function irEtapa(id){
 const el=document.getElementById(id);
 const box=document.getElementById("modalbox");
 if(!el||!box) return;
 const top=el.offsetTop-18;
 box.scrollTo({top:Math.max(0,top),behavior:"smooth"});
}

 <div class="field full"><label>Turmas * <span class="small muted">Uma aluna pode pertencer a várias turmas, inclusive com professoras diferentes.</span></label><div class="turmas-multi">${db.classes.map(c=>`<label class="turma-check"><input type="checkbox" name="turmaIds" value="${c.id}" ${turmaIds.map(String).includes(String(c.id))?"checked":""}> ${esc(c.nome)} · ${esc(c.modalidade)} · ${esc(c.dia)} ${esc(c.hora)}</label>`).join("")||'<span class="small muted">Cadastre uma turma primeiro.</span>'}</div></div>

 <div id="etapa5" class="full section-title">⑨ Contrato de prestação de serviço</div>
 <div class="panel full" style="margin:0;box-shadow:none;background:#fcfafc"><div class="actions"><button type="button" class="btn" onclick="visualizarContrato(${id||0})">Visualizar contrato integral</button></div><p class="small muted">O contrato ficará vinculado a esta matrícula. O aceite é feito pela aluna no contrato.</p></div>

 <div class="full actions" style="justify-content:flex-end"><button type="button" class="btn" onclick="closeM()">Cancelar</button><button class="btn primary">Salvar matrícula</button></div>
 </form>`);
 document.getElementById("studentPhoto").onchange=e=>previewPhoto(e,"studentPhotoPreview");
 document.querySelectorAll('input[name="fobias"]').forEach(r=>r.onchange=()=>{const d=document.getElementById("fobiaDetalhe");if(d)d.style.display=document.querySelector('input[name="fobias"]:checked')?.value==="Sim"?"":"none"});
 document.getElementById("studentForm").onsubmit=e=>{e.preventDefault();saveAluno(e,id)};
}
function collectChecks(fd,name){return fd.getAll(name)}
function saveAluno(e,id){
 const fd=new FormData(e.currentTarget), o=Object.fromEntries(fd.entries());
 const preview=document.getElementById("studentPhotoPreview"); const old=id?db.students.find(s=>s.id==id):null; o.foto=(preview&&preview.src&&preview.src.startsWith("data:"))?preview.src:(old?.foto||"");
 ["objetivos","fisicas","respiratorias","autoimunes","psicologicas","modalidades","turmaIds"].forEach(k=>o[k]=collectChecks(fd,k));
 o.turmaIds=(o.turmaIds||[]).map(Number);
 o.modalidades=o.modalidades||[];
 o.modalidade=o.modalidades[0]||"";
 o.turmaId=o.turmaIds[0]||"";
 if(!o.modalidades.length){alert("Selecione pelo menos uma modalidade.");return;}
 if(!o.turmaIds.length){alert("Selecione pelo menos uma turma.");return;}
 o.mensalidade=Number(o.mensalidade||0);o.id=id||uid();o.numeroMatricula=id?(db.students.find(s=>s.id==id)?.numeroMatricula||""):"MAT-"+String(db.students.length+1).padStart(4,"0");
 if(id) Object.assign(db.students.find(s=>s.id==id),o); else db.students.push(o);
 log(id?"Matrícula atualizada":"Nova matrícula",o.nome);save();closeM();render();visualizarContrato(o.id);
}
function abrirAluno(id){
 if(session?.tipo!=="teacher"){novaMatricula(id);return}
 const s=db.students.find(x=>x.id==id); if(!s)return;
 const turmaIds=Array.isArray(s.turmaIds)?s.turmaIds:(s.turmaId?[s.turmaId]:[]);
 const cs=turmaIds.map(id=>db.classes.find(x=>x.id==id)).filter(Boolean);
 if(session?.tipo==="teacher" && !cs.some(c=>teacherOwnsClass(c))){alert("Esta aluna não pertence a uma turma desta professora.");return}
 const turmasTexto=cs.map(c=>`${esc(c.nome)} · ${esc(c.dia)} ${esc(c.hora)}`).join("<br>")||"—";
 openM("Ficha da aluna",`<div class="panel"><h2>${esc(s.nome)}</h2><p><strong>Contato:</strong> ${esc(s.fone||"—")} &nbsp; <strong>Responsável:</strong> ${esc(s.respNome||"—")}</p><p><strong>Turmas:</strong><br>${turmasTexto}</p></div><div class="panel"><h2>Ficha de saúde</h2><p><strong>Tabagismo:</strong> ${esc(s.tabagismo||"—")} · <strong>Alergias:</strong> ${esc(s.alergias||"—")} · <strong>Cirurgias:</strong> ${esc(s.cirurgias||"—")} · <strong>Fobias:</strong> ${esc(s.fobias||"—")}</p><p><strong>Físicas:</strong> ${esc((s.fisicas||[]).join(", ")||"—")}</p><p><strong>Respiratórias:</strong> ${esc((s.respiratorias||[]).join(", ")||"—")}</p><p><strong>Autoimunes:</strong> ${esc((s.autoimunes||[]).join(", ")||"—")}</p><p><strong>Psicológicas:</strong> ${esc((s.psicologicas||[]).join(", ")||"—")}</p><p><strong>Observações de saúde:</strong> ${esc(s.saudeObs||"—")}</p></div><div class="panel"><h2>Observações para a aula</h2><textarea id="teacherObs" style="min-height:120px">${esc(s.obs||"")}</textarea><div class="actions" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" onclick="salvarObsProf(${s.id})">Salvar observação</button></div></div>`)
}
function salvarObsProf(id){const s=db.students.find(x=>x.id==id);if(!s)return;const v=document.getElementById("teacherObs").value;s.obs=v;save();log("Observação da aluna atualizada",s.nome);closeM();alert("Observação salva.")}


function novoProfessor(id){

 openM(id?"Editar professor":"Novo professor",`<form id="profForm" class="form-grid">

 <div class="field"><label>CPF</label><input name="cpf" value="${esc(t.cpf)}"></div><div class="field"><label>Celular / WhatsApp</label><input name="fone" value="${esc(t.fone)}"></div>
 <div class="field"><label>E-mail</label><input name="email" value="${esc(t.email)}"></div><div class="field"><label>Usuário / e-mail de acesso</label><input name="login" value="${esc(t.login||t.email||"")}" placeholder="Ex.: ale@fenix"></div><div class="field"><label>Acesso ao sistema</label><select name="acessoAtivo"><option value="true" ${t.acessoAtivo!==false?"selected":""}>Ativo</option><option value="false" ${t.acessoAtivo===false?"selected":""}>Desativado</option></select></div><div class="field"><label>Observações</label><input name="obs" value="${esc(t.obs)}"></div>
 <div class="full actions" style="justify-content:flex-end"><button type="button" class="btn" onclick="closeM()">Cancelar</button><button class="btn primary">Salvar professor</button></div></form>`);
 document.getElementById("teacherPhoto").onchange=e=>previewPhoto(e,"teacherPhotoPreview");

async function callFenixAppsScript(action,payload={}){
  if(!SUPABASE_CONFIG.appsScriptUrl || SUPABASE_CONFIG.appsScriptUrl.startsWith("COLE_")) throw new Error("URL do Apps Script não configurada.");
  const {data}=await supabaseClient.auth.getSession();
  const accessToken=data?.session?.access_token;
  if(!accessToken) throw new Error("Sessão de autenticação expirada.");
  const body=new URLSearchParams({access_token:accessToken,action,...payload});
  const response=await fetch(SUPABASE_CONFIG.appsScriptUrl,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body,keepalive:true});
  const text=await response.text();
  try{return JSON.parse(text)}catch(_){return {ok:true,raw:text}}
}

async function enviarWhatsAppFenix(to,message,meta={}){
  if(!to||!message) throw new Error("Destinatário e mensagem são obrigatórios.");
  const result=await callFenixAppsScript("send_whatsapp",{to,message});
  if(result?.status==="erro"||result?.ok===false) throw new Error(result.error||"Falha no WhatsApp.");
  if(supabaseReady){
    await supabaseClient.from("comunicacoes").insert({
      aluna_id:meta.aluna_id||null,
      contrato_id:meta.contrato_id||null,
      contato:to,
      tipo:meta.tipo||"comunicado",
      conteudo:message,
      canal:"whatsapp",
      status:"enviado",
      enviado_em:result.enviado_em||new Date().toISOString(),
      identificador_externo:result.identificador_externo||null,
      resposta:result||null
    });
  }
  return result;
}

async function enviarEmailFenix(to,subject,body,meta={}){
  const result=await callFenixAppsScript("send_email",{to,subject,body});
  if(result?.ok===false) throw new Error(result.error||"Falha no e-mail.");
  if(supabaseReady){
    await supabaseClient.from("comunicacoes").insert({
      aluna_id:meta.aluna_id||null,
      contrato_id:meta.contrato_id||null,
      contato:to,
      tipo:meta.tipo||"email",
      conteudo:body,
      canal:"email",
      status:"enviado",
      enviado_em:result.enviado_em||new Date().toISOString(),
      identificador_externo:null,
      resposta:result||null
    });
  }
  return result;
}

async function enviarContratoEmail(id){
  const s=db.students.find(x=>String(x.id)===String(id));
  if(!s)return;
  if(!s.email){alert("Esta aluna não possui e-mail cadastrado.");return}
  if(!supabaseReady){alert("Supabase não está conectado.");return}
  const alunaRemote=remoteForLocal("alunas",s.id);
  if(!alunaRemote){alert("A aluna ainda não está sincronizada no Supabase.");return}

  const subject="Contrato de Matrícula - Estúdio de Danças Fênix";
  const bodyBase=`Olá, ${s.nome}.\n\nSegue o seu contrato de matrícula do Estúdio de Danças Fênix.\n\n${CONTRACT}\n\nO aceite deve ser realizado por este link:\n${location.origin}${location.pathname}?contrato=TOKEN_CONTRATO\n\nAtenciosamente,\nEstúdio de Danças Fênix`;

  const {data:contrato,error}=await supabaseClient.from("contratos").insert({
    aluna_id:alunaRemote,
    versao:"1",
    conteudo:CONTRACT,
    status:"pendente"
  }).select("id,token_aceite").single();

  if(error||!contrato){alert("Não foi possível criar o contrato no Supabase.");return}

  const body=bodyBase.replace("TOKEN_CONTRATO",contrato.token_aceite);
  try{
    await enviarEmailFenix(s.email,subject,body,{aluna_id:alunaRemote,contrato_id:contrato.id,tipo:"contrato_enviado"});
    await supabaseClient.from("contratos").update({status:"enviado",enviado_em:new Date().toISOString()}).eq("id",contrato.id);
    log("Contrato enviado",s.nome+" → "+s.email);
    alert("Contrato enviado para o e-mail da aluna.\n\nDestino: "+s.email);
  }catch(err){
    await supabaseClient.from("contratos").delete().eq("id",contrato.id);
    alert("Não foi possível enviar o contrato: "+err.message);
  }
}

async function consultarAceiteOnline(id){
  const s=db.students.find(x=>String(x.id)===String(id));
  if(!s||!supabaseReady)return;
  const alunaRemote=remoteForLocal("alunas",s.id); if(!alunaRemote)return;
  const {data,error}=await supabaseClient.from("contratos").select("status,aceito_em").eq("aluna_id",alunaRemote).order("created_at",{ascending:false}).limit(1).maybeSingle();
  if(error||!data)return;
  if(data.status==="aceito"){
    s.contratoAceito=true;
    s.contratoAceitoEm=data.aceito_em||"";
    saveLocalOnly();
    const box=document.getElementById("modalbox");
    if(box){
      const checkbox=box.querySelector("#contractAccept"); if(checkbox){checkbox.checked=true;checkbox.disabled=true;}
      const status=box.querySelector("[data-contract-status]"); if(status)status.innerHTML='<span class="badge ok">Contrato: Aceito</span>';
      const note=box.querySelector("[data-contract-note]"); if(note)note.textContent="Contrato aceito em "+new Date(s.contratoAceitoEm).toLocaleString("pt-BR")+".";
    }
  }
}
