.login-setup h2{margin:0 0 8px;font:700 25px Georgia,serif;color:#5b1a5d}.login-setup p{margin:0 0 18px;color:#76677a;font-size:13px}.login-setup .field{margin-bottom:13px}.login-setup label{display:block;font-size:12px;font-weight:700;color:#5c4d60;margin-bottom:6px}.login-setup input{width:100%;border:1px solid #d9cfe0;border-radius:10px;padding:11px 12px;background:#fff;color:#33253a;outline:none;box-sizing:border-box}.login-setup button{width:100%;border:0;border-radius:11px;padding:12px;background:#5b1a5d;color:#fff;font-weight:700;cursor:pointer}.login-setup .cancel{margin-top:8px;background:#f6eff7;color:#5b1a5d}
.app{display:none;min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:245px;background:linear-gradient(180deg,#321034,#4d164f 62%,#351039);color:#fff;padding:18px 14px;overflow:auto}
.fe-sidebar{margin-top:18px;text-align:center;opacity:.95}.fe-sidebar img{width:135px;height:155px;object-fit:cover;object-position:center 30%;border-radius:18px;box-shadow:0 8px 20px rgba(0,0,0,.14)}
.fe-welcome{display:flex;align-items:center;gap:18px;background:linear-gradient(90deg,#f1e3f3,#fff,#fbf2df);border:1px solid #eadfea;border-radius:18px;padding:12px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
.fe-welcome img{width:92px;height:92px;object-fit:cover;object-position:center 32%;border-radius:14px}.fe-welcome strong{color:var(--violet);font-family:Georgia,serif;font-size:18px}.fe-welcome p{margin:5px 0 0;color:var(--muted);font-size:12px}

.login h1{text-align:center;color:var(--violet);margin:0 0 6px;font-family:Georgia,serif;font-size:30px}
.login .sub{text-align:center;color:var(--muted);margin:0 0 26px}
.login-note{margin-top:18px;padding:12px 14px;background:#faf4fb;border-radius:12px;font-size:12px;color:var(--muted)}
label{display:block;font-size:12px;font-weight:700;color:#5c4d60;margin-bottom:6px}

input:focus,select:focus,textarea:focus{border-color:var(--violet3);box-shadow:0 0 0 3px #efe1f1}
textarea{min-height:100px;resize:vertical}.field{margin-bottom:14px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.full{grid-column:1/-1}
.btn{border:1px solid #d8ceda;background:#fff;color:var(--violet);padding:10px 14px;border-radius:10px;font-weight:700}
.btn:hover{filter:brightness(.98)} .btn.primary{background:var(--violet);color:#fff;border-color:var(--violet)}
.btn.gold{background:#fbf1dc;border-color:#e8cf9c;color:#70440b}.btn.danger{color:var(--danger);border-color:#e8c6cd}

.nav button:hover,.nav button.active{background:rgba(255,255,255,.13)} .ico{width:22px;text-align:center}
.main{margin-left:245px;min-height:100vh}.top{height:72px;background:#fff;border-bottom:1px solid #eee4ef;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}
.top-left{display:flex;align-items:center;gap:14px}.quote{font:italic 16px Georgia,serif;color:var(--violet2)}.top-right{display:flex;align-items:center;gap:14px}.user-pill{display:flex;align-items:center;gap:9px;font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--violet);color:#fff;font-weight:800}
.page{padding:28px;max-width:1500px;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:22px}.page-head h1{margin:0;color:var(--violet);font:700 30px Georgia,serif}.page-head p{margin:6px 0 0;color:var(--muted)}

.panel{background:#fff;border:1px solid #eadfea;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}.panel h2{margin:0 0 15px;color:var(--violet);font:700 19px Georgia,serif}.panel h3{color:var(--violet);margin:0 0 10px}
.section-title{display:flex;align-items:center;gap:8px;padding:10px 13px;background:linear-gradient(90deg,#f0e2f2,#fbf8fc);border-radius:11px;color:var(--violet);font-weight:800;margin:4px 0 15px}
table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid #eee7ef;text-align:left;font-size:13px;vertical-align:middle}th{color:#6c5a70;font-size:11px;text-transform:uppercase;letter-spacing:.6px}tr:hover td{background:#fcf9fd}
.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.ok{background:#e6f2eb;color:var(--ok)}.pending{background:#fff0d7;color:var(--warn)}.bad{background:#f8e3e7;color:var(--danger)}.neutral{background:#eee8f0;color:#65596a}

.search{max-width:520px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:15px;flex-wrap:wrap}

.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.check{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#faf7fb;border-radius:9px;font-size:13px}.check input{width:auto}
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.att-item{border:1px solid #eadfea;border-radius:12px;padding:12px;background:#fff;display:flex;align-items:center;justify-content:space-between}.att-item label{margin:0;display:flex;gap:9px;align-items:center;font-size:13px}.att-item input{width:auto}
.bars{display:grid;gap:10px}.bar-row{display:grid;grid-template-columns:120px 1fr 90px;align-items:center;gap:10px;font-size:12px}.bar{height:11px;background:#eee5ef;border-radius:20px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--violet3));border-radius:20px}

<body>

<div id="loginScreen" class="login">
  <div class="login-scene">
    <img id="loginArt" class="login-art" src="./logo-fenix.png" alt="Tela de abertura do Estúdio de Danças Fênix" decoding="async" fetchpriority="high">
    <div id="loginInteractive" class="login-interactive">
      <select id="loginUser" class="login-hit-user" aria-label="Usuário"></select>
      <input id="loginEmail" type="email" autocomplete="username" aria-label="E-mail de acesso" placeholder="E-mail de acesso" hidden><div id="loginUserMenu" class="login-user-menu" role="listbox" aria-label="Escolher usuário"></div>
      <span id="loginUserCover" class="login-field-cover user-cover" aria-hidden="true"></span>
      <button type="button" id="loginUserValue" class="login-user-value" aria-haspopup="listbox">Nahid</button>
      <input id="loginPass" class="login-hit-pass" type="password" aria-label="Senha" placeholder="Digite sua senha" autocomplete="current-password">
      <span id="loginPassCover" class="login-field-cover pass-cover" aria-hidden="true"></span>
      <span id="loginPassPlaceholder" class="login-pass-placeholder">Digite sua senha</span>
      <button id="loginEye" class="login-hit-eye" type="button" aria-label="Mostrar senha">Mostrar senha</button>
      <button id="loginEnter" class="login-hit-enter" type="button" aria-label="Entrar">Entrar</button>
      <input id="rememberMe" class="login-hit-remember" type="checkbox" aria-label="Lembrar de mim">
      <label for="rememberMe" class="login-hit-remember-label" aria-label="Lembrar de mim">Lembrar de mim</label>
      <span id="loginRememberMark" class="login-remember-mark" aria-hidden="true">✓</span>
      <button id="loginForgot" class="login-hit-forgot" type="button" aria-label="Esqueci minha senha">Esqueci minha senha</button>
    </div>
    <div id="loginSetup" class="login-setup" style="display:none"></div>
  </div>
</div>

<div id="app" class="app">
  <aside class="sidebar">
    <div class="brand"><img id="sideLogo" alt="Estúdio de Danças Fênix"><small>GESTÃO DO ESTÚDIO</small></div>
    <div class="nav">
      <div class="nav-title">Principal</div>
      <button data-view="painel">⌂ <span>Painel</span></button>

const CONTRACT = "Contrato de Prestação de Serviço\nCLÁUSULA 1ª – FINALIDADE\nO contrato é estabelecido sob a lei nº 13.278/2016 de Diretrizes e Bases da Educação Nacional, e tem por finalidade a prestação de serviços educacionais em DANÇA.\nCLÁUSULA 2ª – PAGAMENTO E ENCARGOS\nO valor da mensalidade e taxa de matrícula, assim como pacotes promocionais, são informados na secretaria ou através do atendimento online. A mensalidade deve ser paga na data escolhida via PIX, cartão de débito ou dinheiro. Atrasos geram multa de 5% e juros de 1% ao dia. Em caso de atraso, o aluno ou responsável deve entrar em contato com a secretaria para solicitar o valor corrigido.\nServiços adicionais, como: cursos, workshops, figurinos, inscrições, serão cobrados separadamente.\n2.1. Natureza dos Pagamentos Iniciais. O valor referente à Taxa de Matrícula e à Primeira Mensalidade, pagos no ato da matrícula, referem-se, respectivamente, aos custos administrativos e à remuneração do primeiro mês de aulas. Nenhum destes valores constitui caução, taxa de reserva ou crédito para cobrir mensalidades futuras. Em caso de rescisão contratual, o pagamento integral da mensalidade é devido, a menos que haja comunicação formal de desistência conforme a CLÁUSULA 10ª.\nCLÁUSULA 3ª – INADIMPLÊNCIA, COBRANÇA E NEGATIVAÇÃO\n3.1. O atraso no pagamento da mensalidade, a partir de 30 (trinta) dias, a contar da data de vencimento, caracterizará o aluno ou responsável como inadimplente.\n3.2. Fica expressamente reservado ao Estúdio o direito de, após prévia notificação ao aluno ou responsável, através de e-mail ou WhatsApp, realizar a cobrança extrajudicial e incluir o CPF nos cadastros de proteção ao crédito (SERASA, SPC, etc.).\n3.3. Todos os custos decorrentes da cobrança, incluindo custas judiciais e honorários advocatícios e de cobrança, serão de responsabilidade do aluno ou responsável.\n3.4. O Estúdio se compromete a promover a imediata baixa do registro após a comprovação do pagamento integral dos débitos em aberto.\nCLÁUSULA 4ª – USO DO SERVIÇO POR MEIO DE CHECK-IN (APLICATIVOS)\n4.1. Para alunos que utilizam check-in (Wellhub/Gympass, Totalpass, Gurupass, Namupass, etc.), a vaga nas aulas está condicionada à frequência regular.\n4.2. O registro de duas faltas consecutivas sem justificativa plausível e/ou comunicação prévia, poderá acarretar a perda imediata da vaga na respectiva turma.\n4.3. A retomada das aulas dependerá da disponibilidade de nova vaga, sujeita à reativação do plano e, se aplicável, ao pagamento de nova taxa de matrícula.\nCLÁUSULA 5ª – CORPO DOCENTE\nAs aulas são ministradas por professoras qualificadas. Com o foco no bem-estar físico e emocional dos alunos, assim como no aprendizado, respeitando os limites individuais.\nCLÁUSULA 6ª – EVENTOS E ESPETÁCULOS\nO aluno poderá participar de espetáculos internos ou externos, com autorização dos responsáveis se menor de idade. A participação é opcional, mas sujeita à aceitação das condições da escola, como figurino e ensaios. Alunos inadimplentes ou com baixa frequência podem ficar fora dos eventos.\nCLÁUSULA 7ª – SAÚDE\nÉ obrigatório o preenchimento total do formulário de saúde, e caso seja necessário, será solicitado a apresentação de atestado médico.\nCLÁUSULA 8ª – PROTOCOLO DE SEGURANÇA\nEm situações de epidemias, pandemias ou catástrofes, os alunos e responsáveis devem seguir os protocolos de segurança definidos pela escola, que estarão alinhados com a OMS (Organização Mundial de Saúde).\nCLÁUSULA 9ª – DISCRIMINAÇÃO\nIntolerância religiosa, preconceito, homofobia e racismo são crimes inafiançáveis e imprescritíveis, conforme a Lei nº 7.716/89 (Lei do Crime Racial) e demais dispositivos da legislação brasileira. Qualquer ato discriminatório por alunos ou responsáveis resultará em medidas disciplinares que podem incluir: advertência, suspensão ou rescisão do contrato, além de medidas judiciais indenizatórias à parte ofendida. A escola se compromete a manter um ambiente seguro e respeitoso para todos.\nCLÁUSULA 10ª – DESISTÊNCIA E RESCISÃO CONTRATUAL\n10.1. Em caso de DESISTÊNCIA, o aluno ou responsável deverá comunicar ao Estúdio por escrito (e-mail ou WhatsApp) com ANTECEDÊNCIA MÍNIMA DE TRINTA DIAS do vencimento da mensalidade.\n10.2. A ausência desta comunicação no prazo estabelecido implicará na cobrança da próxima mensalidade integral, a fim de cobrir os custos administrativos e a manutenção da vaga.\n10.3. Somente a ausência do aluno nas aulas, não será considerada como desistência.\n🛑 NORMAS INTERNAS (CUMPRIMENTO OBRIGATÓRIO)\nEstas normas devem ser cumpridas por alunos e responsáveis.\nI. ACESSO E PONTUALIDADE\nUniforme Obrigatório: O aluno deve estar uniformizado antes de entrar na sala de aula.\nPontualidade: Chegue com no mínimo 10 minutos de antecedência para se preparar.\nTolerância e Atrasos: Será concedida uma tolerância máxima de 5 (cinco) minutos após o início da aula.\nAcompanhantes: Não é permitido acompanhante ou responsável dentro da sala de aula.\nII. CONDUTA E SEGURANÇA\nDisciplina: Mantenha disciplina, respeito e atenção aos colegas e professores.\nResponsabilidade por Acidentes: Caso as orientações dos professores não sejam seguidas, a escola não se responsabiliza por acidentes durante as aulas, ensaios e eventos.\nGuarde seus pertences: A escola não se responsabiliza por perdas, furtos ou danos a objetos pessoais.\nComunicação de Faltas: Devem ser sempre comunicadas no GRUPO OFICIAL do WhatsApp. Ausências frequentes prejudicam a evolução e podem levar à exclusão de espetáculos (conforme CLÁUSULA 6ª).\nIII. SAÚDE E SALA DE AULA\nAlimentação e Hidratação: É proibido comer dentro da sala de aula. É obrigatório trazer garrafa de água.\nDECLARAÇÃO DE CIÊNCIA\nDeclaro, sob pena da lei, que todas as informações fornecidas são verdadeiras e completas. Reconheço ter lido, compreendido e concordado com todas as cláusulas e condições do contrato, assim como as normas internas, estando ciente de meus direitos, deveres e obrigações.";

async function saveRecord(collection,row){
 const table=COLLECTIONS[collection];if(!table)throw new Error('Tipo de registro inválido.');
 if(session?.tipo!=='admin'&&!['students','attendance'].includes(collection))throw new Error('Sem permissão para alterar este registro.');
 if(session?.tipo==='teacher'&&collection==='students'&&!teacherOwnsStudent(row))throw new Error('Aluna não vinculada à professora.');
 if(collection==='attendance'&&!visibleClasses().some(c=>String(c.id)===String(row.turmaId)))throw new Error('Turma não autorizada.');
 const id=ensureRemote(table,row.id), original=baseline[collection+':'+row.id];
 const old=original?JSON.parse(original):null;
 const remote=(t,x)=>{const v=remoteForLocal(t,x);if(!v)throw new Error('Vínculo ausente ao salvar '+collection+': '+t+' ('+String(x??'sem identificação')+').');return v;};
 let fields={}, links=null;
 if(collection==='teachers'){
  const foto=typeof row.foto==='string'&&!row.foto.startsWith('data:')?row.foto:null;
  fields={nome:row.nome,telefone:row.fone||null,foto_url:foto,status:row.acessoAtivo===false?'inativo':'ativo'};
 }
 if(collection==='classes'){
  const mods=await sbSelect('modalidades');const mod=mods.find(m=>m.nome===row.modalidade);
  if(!mod)throw new Error('A modalidade selecionada precisa estar cadastrada no banco.');
  fields={nome:row.nome,modalidade_id:mod.id,dia_semana:dayNames.indexOf(row.dia),horario:row.hora,professora_id:remote('professoras',row.profId),status:row.status||'ativo',limite_alunos:Number(row.limite||0),observacao:row.obs||null};
 }
 if(collection==='students'){
  fields={nome:row.nome,telefone:row.fone||null,email:row.email||null,endereco:row.endereco||null,data_nascimento:row.nasc||null,cpf:row.cpf||null,rg:row.rg||null,foto_url:row.foto||null,responsavel_nome:row.respNome||null,responsavel_cpf:row.respCpf||null,responsavel_telefone:row.respFone||null,responsavel_parentesco:row.respParentesco||null,menor:!!row.menor,status:row.status||'ativo'};
  const desired=(row.turmaIds||[]).map(x=>remote('turmas',x));
  if(!old||JSON.stringify(old.turmaIds)!==JSON.stringify(row.turmaIds))links={turmas:desired};
  if(session.tipo==='teacher'){
   if(!old)throw new Error('Professoras não podem criar matrículas.');
   const a=clone(row),b=clone(old);delete a.obs;delete b.obs;
   if(JSON.stringify(a)!==JSON.stringify(b))throw new Error('Professoras podem alterar somente as observações para a aula.');
   fields={};links=null;
  }
 }
 if(collection==='payments'||collection==='expenses'){
  if(!Number.isFinite(Number(row.valor))||Number(row.valor)<0)throw new Error('Informe um valor válido.');
  fields={tipo:collection==='expenses'?'saida':row._tipo||'mensalidade',descricao:row.comp||row.nome||row.aluno,valor:Number(row.valor),vencimento:row.venc||null,status:row.pago?'pago':(['negociado','cancelado'].includes(row._status)?row._status:'em_aberto'),pago_em:row.pago?(old?.pago&&old.data===row.data?row._pagoEm:row.data?row.data+'T12:00:00-03:00':null):null};
  if(collection==='payments'){fields.aluna_id=remote('alunas',row.studentId);fields.forma_pagamento=row.forma||null;}
 }
 if(collection==='events'&&!row.turmaId)throw new Error('Selecione a turma do evento.');
 if(collection==='events')fields={nome:row.nome,data:row.data,local:row.local||null,observacao:row.obs||null,turma_id:row.turmaId?remote('turmas',row.turmaId):null};
 if(collection==='commemorative')fields={nome:row.nome,data:row.data,observacao:row.obs||null,ativo:true};
 if(collection==='attendance'){
  fields={turma_id:remote('turmas',row.turmaId),data:row.data};
  links={presencas:row.studentIds.map((sid,i)=>({aluna_id:remote('alunas',sid),status:row.status[i]==='Presente'?'presente':'ausente',dados_fenix:{status:row.status[i]}}))};
 }
 fields.dados_fenix=session.tipo==='teacher'&&collection==='students'?{obs:row.obs||''}:cleanExtra(row);
 let rpc='fenix_salvar_registro', params={p_tabela:table,p_id:id,p_dados:fields,p_versao:Number(row._version||0),p_vinculos:links};
 if(session.tipo==='teacher'&&collection==='students'){
  rpc='fenix_salvar_observacao_professora';params={p_id:id,p_obs:row.obs||'',p_versao:Number(row._version||0)};
 }
 if(session.tipo==='teacher'&&collection==='attendance'){
  rpc='fenix_salvar_aula_professora';params={p_id:id,p_turma:fields.turma_id,p_data:fields.data,p_versao:Number(row._version||0),p_presencas:links.presencas,p_dados:fields.dados_fenix};
 }
 const {data,error}=await supabaseClient.rpc(rpc,params);
 if(error)throw new Error(error.code==='PGRST202'?'O banco precisa receber a atualização de salvamento. Nenhum sucesso foi confirmado.':error.message);
 if(!data||data.id!==id||!Number.isInteger(data.fenix_version))throw new Error('O banco não confirmou o salvamento.');
 row._version=data.fenix_version;
}
async function syncChangedData(){
 if(syncPromise)return syncPromise;
 syncPromise=(async()=>{
  if(!dataLoaded||!session)throw new Error('Os dados atuais precisam ser carregados antes de salvar.');
  setSaveStatus('Salvando…');
  for(const collection of Object.keys(COLLECTIONS))for(const row of db[collection]){
   if(baseline[collection+':'+row.id]===JSON.stringify(row))continue;
   const snapshot=clone(row);await saveRecord(collection,snapshot);
   row._version=snapshot._version;baseline[collection+':'+row.id]=JSON.stringify(snapshot);saveLocalOnly();
  }
  setSaveStatus(hasPendingChanges()?'Há alterações pendentes.':'Salvo no banco',hasPendingChanges()?'pending':'ok');
 })().catch(err=>{saveLocalOnly();setSaveStatus('Não salvo: '+err.message,'bad');throw err;}).finally(()=>{syncPromise=null;});
 return syncPromise;
}
async function save(){saveLocalOnly();return syncChangedData();}

function allLoginUsers(){
  const a=[
    {id:"nahid",nome:"Nahid",tipo:"admin",email:SUPABASE_CONFIG.adminEmails.nahid},
    {id:"tati",nome:"Tati",tipo:"admin",email:SUPABASE_CONFIG.adminEmails.tati}
  ];
  // Before authentication the protected Supabase teacher records are unavailable.
  // The old browser copy is used only to label known login choices; authentication
  // and permissions are always confirmed by Supabase after sign-in.
  const legacyLogin=safeRead(KEY,null);
  const legacyLoginTeachers=Array.isArray(legacyLogin?.teachers)?legacyLogin.teachers:[];
  const loginTeachers=[...uniqueTeachers()];
  for(const old of legacyLoginTeachers){
   const current=loginTeachers.find(t=>teachersMatch(t,old));
   if(current){for(const field of ['email','nome'])if(!current[field]&&old[field])current[field]=old[field];}
   else loginTeachers.push(old);
  }
  loginTeachers.forEach(t=>{if(t.email)a.push({id:"prof:"+t.id,nome:t.apelido||t.nome,tipo:"teacher",email:t.email,teacherId:t.id,ativo:t.acessoAtivo!==false})});
  a.push({id:"email",nome:"Outro acesso (e-mail)",tipo:"email",email:""});
  const seen=new Set();
  return a.filter(u=>{
    const key=String(u.email||u.nome||u.id).trim().toLowerCase();
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

// Do not merge people by name: homonyms are different records.
function teachersMatch(a,b){
 const digits=v=>String(v||'').replace(/\D/g,'');
 const norm=v=>String(v||'').trim().toLowerCase();
 return (digits(a?.cpf)&&digits(a.cpf)===digits(b?.cpf))||
  (norm(a?.email)&&norm(a.email)===norm(b?.email))||
  (digits(a?.fone)&&digits(a.fone)===digits(b?.fone))||
  (norm(a?.nome)&&norm(a.nome)===norm(b?.nome));
}
function uniqueTeachers(){
 const groups=[];
 for(const t of db.teachers){
  const keep=groups.find(g=>teachersMatch(g,t));
  if(!keep){groups.push({...t,_teacherIds:[t.id]});continue;}
  keep._teacherIds.push(t.id);
  for(const field of ['nome','apelido','fone','email','cpf','foto'])if(!keep[field]&&t[field])keep[field]=t[field];
  keep.acessoAtivo=keep.acessoAtivo||t.acessoAtivo;
 }
 return groups;
}

async function renderLogin(){
  const users=allLoginUsers();
  const user=document.getElementById("loginUser"), pass=document.getElementById("loginPass"), enter=document.getElementById("loginEnter");
  const userValue=document.getElementById("loginUserValue"), remember=document.getElementById("rememberMe"), mark=document.getElementById("loginRememberMark"), menu=document.getElementById("loginUserMenu");
  user.innerHTML=users.map(u=>`<option value="${esc(u.id)}">${esc(u.nome)}</option>`).join("");
  const remembered=safeRead("fenix_remember_me",null);
  user.value=(remembered?.user && users.some(u=>u.id===remembered.user))?remembered.user:(users[0]?.id||"nahid");
  pass.value="";
  const updateUser=()=>{const selected=users.find(u=>u.id===user.value);if(userValue)userValue.textContent=selected?.nome||"";document.getElementById("loginEmail").hidden=selected?.id!=="email";};
  if(menu){menu.innerHTML=users.map(u=>`<div class="login-user-option" role="option" data-id="${esc(u.id)}">${esc(u.nome)}</div>`).join("");menu.querySelectorAll(".login-user-option").forEach(o=>o.onclick=()=>{user.value=o.dataset.id;updateUser();menu.classList.remove("open")});}
  document.getElementById("loginUserValue").onclick=()=>{if(menu)menu.classList.toggle("open")};
  remember.onchange=()=>mark&&mark.classList.toggle("on",!!remember.checked);
  user.onchange=updateUser;
  updateUser(); remember.checked=!!remembered; if(mark)mark.classList.toggle("on",!!remember.checked);
  enter.onclick=async e=>{
    e.preventDefault();
    const selected=users.find(x=>x.id===user.value);
    const u=selected?.id==="email"?{...selected,email:document.getElementById("loginEmail").value.trim()}:selected, password=pass.value;
    if(!u||!u.email){alert("Este acesso ainda não possui e-mail de autenticação configurado.");return;}
    if(u.tipo==="teacher"&&u.ativo===false){alert("Este acesso está desativado.");return;}
    enter.disabled=true;
    try{
      initSupabase();authProject="current";
      const {data,error}=await supabaseClient.auth.signInWithPassword({email:u.email,password});
      if(error){const detalhe=[error.message,error.code,error.status].filter(Boolean).join(" | ");throw new Error("Falha na autenticação: "+(detalhe||"erro não informado pelo Supabase."));}
      const pr=await supabaseClient.from("perfis").select("id,nome,papel,status,professora_id").eq("id",data.user.id).single();
      const profile=pr.data;
      if(pr.error||!profile||profile.status!=="ativo"||!["admin","professora","teacher"].includes(profile.papel))throw new Error("Este acesso está desativado ou não foi configurado na base atual.");
      session={id:profile.id,nome:profile.nome,tipo:profile.papel==="admin"?"admin":"teacher",teacherId:profile.professora_id,email:data.user.email,authUserId:data.user.id};
      cacheOwner=data.user.id;
      preservePreviousCache();
      const cached=safeRead(KEY+':'+cacheOwner,null);
      remoteIds=cached?.remoteIds||{};
      await loadSupabaseDb();
      // Legacy browser data is retained only as an explicit backup. Never merge it automatically.
      if(session.tipo==='teacher'&&!db.teachers.some(t=>remoteForLocal('professoras',t.id)===session.teacherId&&t.acessoAtivo))throw new Error('O cadastro da professora está desativado ou sem vínculo.');
      if(cached?.pending){
        // Keep the pending version for explicit, reviewed recovery. Never silently merge stale rows.
        localStorage.setItem(KEY+':pending:'+cacheOwner,JSON.stringify(cached));
        setSaveStatus('Existe uma cópia com alterações pendentes neste aparelho. Exporte-a em Configurações.','pending');
      }
    if(remember.checked)localStorage.setItem("fenix_remember_me",JSON.stringify({user:u.id}));else localStorage.removeItem("fenix_remember_me");
    sessionStorage.setItem("fenix_session",data.user.id);
    start();
    }catch(err){
      dataLoaded=false;session=null;cacheOwner=null;db=structuredClone(DEFAULT);remoteIds={};
      await supabaseClient.auth.signOut().catch(()=>{});alert(err.message);
    }finally{enter.disabled=false;pass.value="";}
  };
  pass.onkeydown=e=>{if(e.key==="Enter")enter.click()};
  document.getElementById("loginEye").onclick=()=>{pass.type=pass.type==="password"?"text":"password"};
  document.getElementById("loginForgot").onclick=async()=>{const selected=users.find(x=>x.id===user.value);const u=selected?.id==="email"?{...selected,email:document.getElementById("loginEmail").value.trim()}:selected;if(!u?.email){alert("Configure o e-mail deste acesso primeiro.");return}const {error}=await supabaseClient.auth.resetPasswordForEmail(u.email,{redirectTo:location.origin+location.pathname});alert(error?"Não foi possível enviar o e-mail de recuperação.":"Enviamos as instruções para o e-mail cadastrado.")};
}

async function startContractAcceptance(){
  const token=new URLSearchParams(location.search).get("contrato");
  if(!token) return false;
  document.body.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f7f3ee;padding:24px"><div style="width:min(720px,100%);background:#fff;border-radius:18px;padding:30px;box-shadow:0 10px 35px rgba(0,0,0,.12);font-family:inherit"><h1 style="margin-top:0">Contrato do Estúdio de Danças Fênix</h1><p>Leia o contrato enviado pelo Estúdio e, estando de acordo, informe os dados para registrar o aceite.</p><div id="contractAcceptanceBox"><p>Carregando contrato...</p></div></div></div>`;
  if(!initSupabase()){
    document.getElementById("contractAcceptanceBox").innerHTML="<p>O sistema de contratos não está configurado.</p>";
    return true;
  }
  const {data,error}=await supabaseClient.from("contratos").select("id,conteudo,status").eq("token_aceite",token).in("status",["pendente","enviado"]).maybeSingle();
  if(error||!data){
    document.getElementById("contractAcceptanceBox").innerHTML="<p>Este link de contrato é inválido, expirou ou já foi utilizado.</p>";
    return true;
  }
  const box=document.getElementById("contractAcceptanceBox");
  box.innerHTML=`<div style="max-height:420px;overflow:auto;border:1px solid #ddd;border-radius:10px;padding:18px;white-space:pre-wrap;margin:18px 0">${esc(data.conteudo||"")}</div><label style="display:block;margin:12px 0 6px">Nome completo</label><input id="acceptName" style="width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box"><label style="display:block;margin:12px 0 6px">CPF/RG ou documento</label><input id="acceptDocument" style="width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box"><label style="display:flex;gap:8px;align-items:center;margin:16px 0"><input type="checkbox" id="acceptCheck"> Declaro que li, compreendi e aceito o contrato.</label><button id="acceptButton" style="padding:12px 20px;border:0;border-radius:8px;cursor:pointer">Aceitar contrato</button><div id="acceptResult" style="margin-top:14px"></div>`;
  document.getElementById("acceptButton").onclick=async()=>{
    const nome=document.getElementById("acceptName").value.trim();
    const documento=document.getElementById("acceptDocument").value.trim();
    const confirmado=document.getElementById("acceptCheck").checked;
    const result=document.getElementById("acceptResult");
    if(!nome||!documento||!confirmado){result.textContent="Preencha os dados e confirme o aceite.";return;}
    const {data:accepted,error:acceptError}=await supabaseClient.rpc("aceitar_contrato",{p_token:token,p_nome:nome,p_documento:documento});
    if(acceptError||accepted===false||accepted===null){result.textContent="Não foi possível registrar o aceite. O contrato pode já ter sido aceito.";return;}
    result.textContent="Contrato aceito com sucesso. Data e horário foram registrados.";
    document.getElementById("acceptButton").disabled=true;
  };
  return true;
}

async function logout(){
  if(hasPendingChanges()&&!confirm("Há alterações não salvas no banco. A cópia ficará neste aparelho. Deseja sair?"))return;
  try{if(supabaseClient)await supabaseClient.auth.signOut()}catch(_){ }
  session=null;cacheOwner=null;dataLoaded=false;db=structuredClone(DEFAULT);remoteIds={};baseline={};
  closeM();document.getElementById("page").replaceChildren();
  sessionStorage.removeItem("fenix_session");
  document.getElementById("app").style.display="none";
  document.getElementById("loginScreen").style.display="grid";
  await renderLogin();
}

function teacherIdMatches(a,b){
 const na=String(a??"").trim(), nb=String(b??"").trim();
 if(!na||!nb)return false;
 const clean=x=>x.replace(/^prof:/i,"").trim();
 const ca=clean(na), cb=clean(nb);
 if(ca===cb)return true;
 if(Number.isFinite(Number(ca))&&Number.isFinite(Number(cb)))return Number(ca)===Number(cb);
 return false;
}
function teacherOwnsClass(c){
 if(session?.tipo!=="teacher"||!c||!session.teacherId)return false;
 const id=remoteIds["professoras:"+session.teacherId+":local"];
 return teacherIdMatches(c.profId,session.teacherId)||(id!=null&&teacherIdMatches(c.profId,id));
}
function teacherOwnsStudent(s){
 if(session?.tipo!=="teacher")return true;
 const ids=Array.isArray(s?.turmaIds)?s.turmaIds:(s?.turmaId!=null?[s.turmaId]:[]);
 return ids.some(id=>db.classes.some(c=>teacherIdMatches(c.id,id) && teacherOwnsClass(c)));
}
function visibleClasses(){
 return session?.tipo==="teacher" ? db.classes.filter(teacherOwnsClass) : db.classes;
}
function visibleStudents(){
 return session?.tipo==="teacher" ? db.students.filter(teacherOwnsStudent) : db.students;
}
function applyAccess(){
 const teacher=session?.tipo==="teacher";
 const allowed=teacher?["alunos","turmas","presenca","experimentais","busca"]:["painel","alunos","professores","turmas","presenca","experimentais","mensalidades","contas","financeiro","eventos","aniversarios","busca","historico","config"];
 document.querySelectorAll(".nav button[data-view]").forEach(b=>{b.style.display=allowed.includes(b.dataset.view)?"":"none"});
 if(!allowed.includes(view))view=teacher?"alunos":"painel";
}
function go(v){const teacher=session?.tipo==="teacher";const allowed=teacher?["alunos","turmas","presenca","experimentais","busca"]:["painel","alunos","professores","turmas","presenca","experimentais","mensalidades","contas","financeiro","eventos","aniversarios","busca","historico","config"];if(!allowed.includes(v))return;view=v;render()}
function render(){
 if(!session)return;applyAccess();
 document.querySelectorAll(".nav button[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
 document.getElementById("page").innerHTML=V[view]?V[view]():V.painel(); bind();
}

let modalReturnFocus=null;
function openM(title,content){
 modalReturnFocus=document.activeElement;
 const modal=document.getElementById("modal"), box=document.getElementById("modalbox");
 if(!modal||!box)return;
 box.innerHTML=`<div class="modal-head"><h2>${esc(title)}</h2><button type="button" class="btn" onclick="closeM()" aria-label="Fechar">✕</button></div>${content}`;
 box.scrollTop=0;box.dataset.draftId=String(uid());box.setAttribute("role","dialog");box.setAttribute("aria-modal","true");box.setAttribute("aria-label",title);
 modal.classList.add("open");
 box.querySelector("button,input,select,textarea")?.focus();
}
function closeM(){
 const modal=document.getElementById("modal"), box=document.getElementById("modalbox");
 if(modal)modal.classList.remove("open");
 if(box)box.innerHTML="";
 modalReturnFocus?.focus?.();
}

}

function collectChecks(fd,name){return fd.getAll(name)}
async function saveAluno(e,id){
 requireAdmin();
 const fd=new FormData(e.currentTarget), o=Object.fromEntries(fd.entries());
 const preview=document.getElementById("studentPhotoPreview"); const old=id?db.students.find(s=>s.id==id):null; o.foto=(preview&&preview.src&&preview.src.startsWith("data:"))?preview.src:(old?.foto||"");
 ["objetivos","fisicas","respiratorias","autoimunes","psicologicas","modalidades","turmaIds"].forEach(k=>o[k]=collectChecks(fd,k));
 o.turmaIds=(o.turmaIds||[]).map(Number);
 o.modalidades=o.modalidades||[];
 o.modalidade=o.modalidades[0]||"";
 o.turmaId=o.turmaIds[0]||"";
 if(!o.modalidades.length){alert("Selecione pelo menos uma modalidade.");return;}
 if(!o.turmaIds.length){alert("Selecione pelo menos uma turma.");return;}
 o.mensalidade=Number(o.mensalidade||0);o.menor=!!o.nasc&&new Date(o.nasc+"T12:00:00")>new Date(new Date().getFullYear()-18,new Date().getMonth(),new Date().getDate());o.id=id||Number(document.getElementById("modalbox").dataset.draftId);o.numeroMatricula=id?(db.students.find(s=>s.id==id)?.numeroMatricula||""):"MAT-"+String(o.id);
 if(id) Object.assign(db.students.find(s=>s.id==id),o); else {const draft=db.students.find(r=>r.id===o.id);if(draft)Object.assign(draft,o);else db.students.push(o);}
 log(id?"Matrícula atualizada":"Nova matrícula",o.nome);await save();closeM();render();visualizarContrato(o.id);
}
function abrirAluno(id){

 const turmaIds=Array.isArray(s.turmaIds)?s.turmaIds:(s.turmaId?[s.turmaId]:[]);
 const cs=turmaIds.map(id=>db.classes.find(x=>x.id==id)).filter(Boolean);
 if(session?.tipo==="teacher" && !cs.some(c=>teacherOwnsClass(c))){alert("Esta aluna não pertence a uma turma desta professora.");return}

async function callFenixAppsScript(action,payload={}){
 requireAdmin();
 if(!SUPABASE_CONFIG.appsScriptUrl)throw new Error("Serviço de envio não configurado.");
 const {data,error}=await supabaseClient.auth.getSession();
 const token=data?.session?.access_token;if(error||!token)throw new Error("Sessão expirada.");
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),30000);
 try{
  const body=new URLSearchParams({...payload,access_token:token,action});
  const response=await fetch(SUPABASE_CONFIG.appsScriptUrl,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body,signal:controller.signal});
  if(!response.ok)throw new Error("O serviço retornou erro HTTP "+response.status+". O envio não foi confirmado.");
  let result;try{result=await response.json();}catch{throw new Error("Resposta inválida do serviço. O envio não foi confirmado.");}
  if(result?.ok!==true)throw new Error(result?.error||"O serviço não confirmou a operação.");return result;
 }catch(error){if(error.name==='AbortError')throw new Error('O serviço demorou a responder. Confira o histórico antes de repetir o envio.');throw error;}finally{clearTimeout(timeout);}
}

async function enviarWhatsAppFenix(to,message,meta={}){
  if(!to||!message) throw new Error("Destinatário e mensagem são obrigatórios.");
  const result=await callFenixAppsScript("send_whatsapp",{to,message});
  if(result?.status==="erro"||result?.ok===false) throw new Error(result.error||"Falha no WhatsApp.");
  if(supabaseReady){
    const recorded=await supabaseClient.from("comunicacoes").insert({
      aluna_id:meta.aluna_id||null,
      contrato_id:meta.contrato_id||null,
      contato:to,
      tipo:meta.tipo||"comunicado",
      conteudo:message,
      canal:"whatsapp",
      status:"enviado",
      enviado_em:result.enviado_em||new Date().toISOString(),
      identificador_externo:result.identificador_externo||null,
      resposta:result||null
    });
    if(recorded.error)throw new Error("O serviço aceitou o envio, mas o histórico não foi salvo. Confira antes de repetir.");
  }
  return result;
}

async function enviarEmailFenix(to,subject,body,meta={}){
  const result=await callFenixAppsScript("send_email",{to,subject,body});
  if(result?.ok===false) throw new Error(result.error||"Falha no e-mail.");
  if(supabaseReady){
    const recorded=await supabaseClient.from("comunicacoes").insert({
      aluna_id:meta.aluna_id||null,
      contrato_id:meta.contrato_id||null,
      contato:to,
      tipo:meta.tipo||"email",
      conteudo:body,
      canal:"email",

      enviado_em:result.enviado_em||new Date().toISOString(),
      identificador_externo:null,
      resposta:result||null
    });
    if(recorded.error)throw new Error("O serviço aceitou o envio, mas o histórico não foi salvo. Confira antes de repetir.");
  }
  return result;
}

async function enviarContratoEmail(id){
  requireAdmin();await save();
  const s=db.students.find(x=>String(x.id)===String(id));
  if(!s)return;
  if(!s.email){alert("Esta aluna não possui e-mail cadastrado.");return}
  if(!supabaseReady){alert("Supabase não está conectado.");return}
  const alunaRemote=remoteForLocal("alunas",s.id);
  if(!alunaRemote){alert("A aluna ainda não está sincronizada no Supabase.");return}

  const subject="Contrato de Matrícula - Estúdio de Danças Fênix";
  const bodyBase=`Olá, ${s.nome}.\n\nSegue o seu contrato de matrícula do Estúdio de Danças Fênix.\n\n${CONTRACT}\n\nO aceite deve ser realizado por este link:\n${location.origin}${location.pathname}?contrato=TOKEN_CONTRATO\n\nAtenciosamente,\nEstúdio de Danças Fênix`;

  const {data:contrato,error}=await supabaseClient.from("contratos").insert({
    aluna_id:alunaRemote,
    versao:"1",
    conteudo:CONTRACT,
    status:"pendente"
  }).select("id,token_aceite").single();

  if(error||!contrato){alert("Não foi possível criar o contrato no Supabase.");return}

  const body=bodyBase.replace("TOKEN_CONTRATO",contrato.token_aceite);
  try{
    await enviarEmailFenix(s.email,subject,body,{aluna_id:alunaRemote,contrato_id:contrato.id,tipo:"contrato_enviado"});
    const updated=await supabaseClient.from("contratos").update({status:"enviado",enviado_em:new Date().toISOString()}).eq("id",contrato.id).select("id").single();
    if(updated.error)throw new Error("O e-mail foi aceito pelo serviço, mas o registro do envio falhou. Confira antes de reenviar.");
    log("Contrato enviado",s.nome+" → "+s.email);
    alert("Contrato enviado para o e-mail da aluna.\n\nDestino: "+s.email);
  }catch(err){
    // Preserve the contract for reconciliation: email may have been accepted before a network failure.
    alert("Não foi possível enviar o contrato: "+err.message);
  }
}

async function consultarAceiteOnline(id){
  const s=db.students.find(x=>String(x.id)===String(id));
  if(!s||!supabaseReady)return;
  const alunaRemote=remoteForLocal("alunas",s.id); if(!alunaRemote)return;
  const {data,error}=await supabaseClient.from("contratos").select("status,aceito_em").eq("aluna_id",alunaRemote).order("created_at",{ascending:false}).limit(1).maybeSingle();
  if(error||!data)return;
  if(data.status==="aceito"){
    s.contratoAceito=true;
    s.contratoAceitoEm=data.aceito_em||"";
    saveLocalOnly();
    const box=document.getElementById("modalbox");
    if(box){
      const checkbox=box.querySelector("#contractAccept"); if(checkbox){checkbox.checked=true;checkbox.disabled=true;}
      const status=box.querySelector("[data-contract-status]"); if(status)status.innerHTML='<span class="badge ok">Contrato: Aceito</span>';
      const note=box.querySelector("[data-contract-note]"); if(note)note.textContent="Contrato aceito em "+new Date(s.contratoAceitoEm).toLocaleString("pt-BR")+".";
    }
  }
}
